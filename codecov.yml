codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: '85...100'
  status:
    project:
      default:
        target: 85%
        threshold: 0%
    patch:
      default:
        target: 85%
        informational: true

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true
