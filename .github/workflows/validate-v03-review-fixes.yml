name: Validate v0.3 review fixes

on:
  push:
    branches:
      - phase/03-http-api-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
