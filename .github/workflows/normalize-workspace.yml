name: Normalize VS Code workspace

on:
  push:
    branches:
      - phase/07-ci-cd
    paths:
      - .github/workflows/normalize-workspace.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase/07-ci-cd

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - run: npm ci

      - run: npx prettier --write angular-template.code-workspace

      - name: Commit workspace formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular-template.code-workspace
          git commit -m "chore: format VS Code workspace"
          git push
