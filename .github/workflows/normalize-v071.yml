name: Normalize v0.7.1 docs

on:
  push:
    branches:
      - phase/07-ci-cd
    paths:
      - .github/workflows/normalize-v071.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/07-ci-cd
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/ci/README.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/README.md
          git commit -m "chore: format v0.7.1 CI documentation"
          git push
