name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - phase/08-bff-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality, coverage, E2E & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint and guardrails
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage gate (>= 85%)
        env:
          COVERAGE_GATE: 85
        run: npm run coverage:check

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (mock + BFF)
        run: npm run e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            playwright-report-bff/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
