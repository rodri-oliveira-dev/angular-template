name: Prepare v0.5 quality baseline

on:
  push:
    branches:
      - phase/05-quality-security

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase/05-quality-security

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Apply safe lint fixes
        run: npm run lint:fix || true

      - name: Apply formatting
        run: npm run format

      - name: Persist generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize quality tooling configuration"
          git push

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e
