name: Validate v0.1

on:
  push:
    branches:
      - phase/01-angular-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke development server
        shell: bash
        run: |
          npm start -- --host 127.0.0.1 > /tmp/angular-template.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4200/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/angular-template.log
          exit 1
