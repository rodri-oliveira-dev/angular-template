name: GitHub Pages

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'scripts/prepare-pages.mjs'
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'scripts/prepare-pages.mjs'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages demo
        run: npm run build:pages

      - name: Validate Pages artifact
        run: |
          test -f dist/angular-template/browser/index.html
          test -f dist/angular-template/browser/404.html
          test -f dist/angular-template/browser/.nojekyll
          grep -F '<base href="/angular-template/">' dist/angular-template/browser/index.html
          cmp dist/angular-template/browser/index.html dist/angular-template/browser/404.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/angular-template/browser
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Smoke check deployed root
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${PAGE_URL}" >/dev/null
