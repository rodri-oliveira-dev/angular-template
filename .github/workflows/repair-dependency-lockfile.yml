name: Temporary dependency lockfile repair

on:
  push:
    branches:
      - fix/consolidated-dependency-security-20261024
    paths:
      - .github/workflows/repair-dependency-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'rodri-oliveira-dev/angular-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate consistent npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean installation and security gate
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): regenerate lockfile with patched transitive packages"
            git push origin HEAD:fix/consolidated-dependency-security-20261024
          fi
