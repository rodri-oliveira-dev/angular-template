name: Validate PR 25 review fixes

on:
  push:
    branches:
      - phase/05-quality-security

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/05-quality-security
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Normalize changed files
        run: npx prettier --write eslint.config.js scripts/check-frontend-security.mjs scripts/check-frontend-security.test.mjs scripts/check-feature-boundaries.mjs scripts/check-feature-boundaries.test.mjs package.json docs/security/README.md
      - name: Persist formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format PR 25 review fixes"
          git push
      - run: npm run format:check
      - run: npm run guardrails:test
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
