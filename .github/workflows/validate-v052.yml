name: Validate v0.5.2 security hardening

on:
  push:
    branches:
      - phase/05-quality-security

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase/05-quality-security

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply formatting
        run: npm run format

      - name: Persist formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize browser security hardening"
          git push

      - name: Format check
        run: npm run format:check

      - name: Lint and source guardrails
        run: npm run lint

      - name: Security scanner tests
        run: npm run security:test

      - name: Dependency audit
        run: npm run security:audit

      - name: Build
        run: npm run build

      - name: Verify Angular autoCSP output
        shell: bash
        run: |
          if ! grep -Riq "content-security-policy" dist; then
            echo "Expected Angular autoCSP metadata was not found in build output."
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e
