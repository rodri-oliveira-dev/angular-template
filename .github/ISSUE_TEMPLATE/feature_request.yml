name: Feature request
description: Propose a reusable capability or improvement for the Angular template
title: '[Feature] '
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the reusable need rather than one product-specific requirement.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the expected template behavior and developer experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: I considered architecture/security implications.
        - label: I considered test and documentation impact.
        - label: This is broadly reusable and not tied to one application.
