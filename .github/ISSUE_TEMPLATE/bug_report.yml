name: Bug report
description: Report a reproducible defect in the reusable Angular template
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the template. Do not include secrets or vulnerability exploit details here; follow SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: Template version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, npm, OS, browser, and relevant Angular versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, cookies, personal data, and unrelated logs.
      render: shell
